training_mode: p1

pretrain:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 4
    walks_per_entity: 200

  word2vec:
    pretrain_epochs: 5
    pretrain_lr: 0.025

finetune:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 4
    walks_per_entity: 300

  word2vec:
    architecture: skipgram
    dim: 200
    window: 5
    lr: 0.025
    min_alpha: 0.0001
    negative: 5
    min_count: 1
    finetune_epochs: 15
    init_strategy: most_specific
    init_relations: true
    initialization_noise: 0
    anchor_regularization: 0.1
