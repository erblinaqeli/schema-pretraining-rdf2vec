# P2 recommended pretrain settings (grid-search winners).
# Use with: scripts/train.py --config conf/p2_recommended.yaml --train-mode p2
# Finetune / instance settings match conf/grid_search_p1p2.yaml (e2e_synthetic defaults).

training_mode: p2

pretrain:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 4
    walks_per_entity: 100

  word2vec:
    pretrain_epochs: 5
    pretrain_lr: 0.025

finetune:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 4
    walks_per_entity: 100

  word2vec:
    architecture: skipgram
    dim: 100
    window: 5
    lr: 0.025
    min_alpha: 0.0001
    negative: 5
    min_count: 1
    finetune_epochs: 5
