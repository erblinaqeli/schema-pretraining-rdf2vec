training_mode: p2

pretrain:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 3
    walks_per_entity: 200

  word2vec:
    pretrain_epochs: 5
    pretrain_lr: 0.025

finetune:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 3
    walks_per_entity: 200

  word2vec:
    architecture: skipgram
    dim: 200
    window: 5
    lr: 0.025
    min_alpha: 0.0001
    negative: 5
    min_count: 1
    sample: 0.0
    hs: 0
    finetune_epochs: 5
    init_strategy: most_specific
    init_relations: true
    initialization_noise: 0
    anchor_regularization: 0
