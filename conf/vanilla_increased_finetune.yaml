# Vanilla RDF2Vec (no protograph pretrain) — matches scripts/train.py defaults.
# Use with: scripts/train.py --config conf/vanilla_increased_finetune.yaml --train-mode vanilla

finetune:
  walks:
    mode: jrdf2vec-duplicate-free
    depth: 4
    walks_per_entity: 300

  word2vec:
    architecture: skipgram
    dim: 200
    window: 5
    lr: 0.025
    min_alpha: 0.0001
    negative: 5
    min_count: 1
    epochs: 15
